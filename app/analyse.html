"use client";

import { useState } from "react";

export default function Home() {
  const [message, setMessage] = useState("");
  const [result, setResult] = useState("");

  return (
    <main className="min-h-screen bg-gray-50 flex flex-col items-center p-6">
      <h1 className="text-3xl font-bold text-center mb-2">ScamShield Care</h1>

      <p className="text-gray-600 text-center mb-6">
        AI Safeguarding Assistant for Scam Risk Detection
      </p>

      <textarea
        className="w-full max-w-3xl p-4 border rounded-lg shadow-sm mb-4 min-h-[220px]"
        placeholder="Paste suspicious message, email, or link here..."
        value={message}
        onChange={(e) => setMessage(e.target.value)}
      />

      <div className="w-full max-w-3xl flex gap-3 mb-6">
        <button
          onClick={() => setResult("Button works")}
          className="bg-blue-600 text-white px-6 py-3 rounded-lg flex-1"
        >
          Analyze Risk
        </button>

        <button
          onClick={() => {
            setMessage("");
            setResult("");
          }}
          className="border border-gray-300 px-6 py-3 rounded-lg bg-white"
        >
          Clear
        </button>
      </div>

      {result && (
        <div className="w-full max-w-3xl rounded-lg border bg-white p-4 shadow-sm">
          {result}
        </div>
      )}

      <p className="text-xs text-gray-500 mt-6">
        We do not store pasted content.
      </p>
    </main>
  );
}
